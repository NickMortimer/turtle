[tool.poetry]
name = "turtledrone"
version = "0.1.0"
description = ""
authors = ["Nick Mortimer <nick.mortimer@csiro.au>"]
readme = "README.md"

[tool.poetry.group.docs.dependencies]
jupyter = "^1.0.0"
sphinx = ">=7,<9"
sphinx-rtd-theme = ">=2,<4"
nbsphinx = ">=0.9,<1.0"

[tool.poetry.dependencies]
python = "^3.9"
chardet = ">=5,<6"
typer = ">=0.12,<1.0"
click = ">=8.1,<8.2"
cookiecutter = ">=2.6,<3"
pysftp = ">=0.2.9,<0.3"
doit = ">=0.36,<1"
pandas = ">=2.0,<3"
numpy = ">=1.24,<3"
scipy = ">=1.10,<2"
scikit-learn = ">=1.3,<2"
scikit-image = ">=0.21,<1"
pyproj = ">=3.6,<4"
opencv-python = ">=4.8,<5"
pyyaml = ">=6,<7"
pyexiftool = ">=0.5,<1"
cameratransform = ">=1.2,<2"
streamlit = {version = ">=1.35,<2", optional = true}
geopandas = {version = ">=0.14,<1", optional = true}
shapely = ">=2.0,<3"
matplotlib = ">=3.7,<4"
plotly = {version = ">=5.14,<6", optional = true}
jinja2 = {version = ">=3.1,<4", optional = true}
kaleido = {version = ">=0.2.1,<1", optional = true}
torch = {version = ">=2.3,<3", optional = true}
torchvision = {version = ">=0.18,<1", optional = true}
ultralytics = {version = ">=8.3,<9", optional = true}

[tool.poetry.extras]
ui = ["streamlit"]
geo = ["geopandas"]
reports = ["plotly", "geopandas", "jinja2", "kaleido"]
ai = ["torch", "torchvision", "ultralytics"]

[tool.poetry.scripts]
# Modern CLI commands (recommended)
drone = 'turtledrone.cli.drone:app'
turtle = 'turtledrone.cli.turtle:app'

# Legacy commands (backward compatibility)
initailise = 'turtledrone:initailise'
tdrone = 'turtledrone.tdrone:tdrone'
exifdata = 'turtledrone:exifdata'
DJIP4RTK = 'turtledrone:DJIP4RTK'
setsurveyarea = 'turtledrone:setsurveyarea'
surveys = 'turtledrone:surveys'
reports = 'turtledrone:reports'


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
